<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Laptop Outer Screen / Frame -->
  <rect x="11" y="9" width="42" height="32" rx="3" fill="#064E3B" />
  
  <!-- Webcam Accent -->
  <circle cx="32" cy="10.5" r="1" fill="#EF4444" />
  
  <!-- Laptop Display Screen -->
  <rect x="14" y="12" width="36" height="26" rx="1.5" fill="#ECFDF5" />
  
  <!-- Screen Header Bar -->
  <path d="M 14 13.5 C 14 12.67 14.67 12 15.5 12 L 48.5 12 C 49.33 12 50 12.67 50 13.5 L 50 17 L 14 17 Z" fill="#064E3B" />
  
  <!-- Window Control Buttons -->
  <circle cx="17.5" cy="14.5" r="0.8" fill="#EF4444" />
  <circle cx="20" cy="14.5" r="0.8" fill="#EF4444" />
  <circle cx="22.5" cy="14.5" r="0.8" fill="#10B981" />

  <!-- Code Graphics on Screen -->
  <!-- Left Bracket < -->
  <path d="M 23 22 L 19 26 L 23 30" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Slash / -->
  <path d="M 29 31 L 33 21" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
  <!-- Right Bracket > -->
  <path d="M 39 22 L 43 26 L 39 30" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- UI Code Lines -->
  <rect x="18" y="33" width="15" height="2" rx="1" fill="#10B981" />
  <rect x="35" y="33" width="10" height="2" rx="1" fill="#EF4444" />

  <!-- Screen Hinge -->
  <rect x="25" y="40" width="14" height="2" rx="1" fill="#064E3B" />

  <!-- Laptop Base Chassis -->
  <path d="M 8 42 L 56 42 L 60 51 C 60 53.2 58.2 55 56 55 L 8 55 C 5.8 55 4 53.2 4 51 Z" fill="#10B981" />
  
  <!-- Laptop Base Shadow / Edge -->
  <path d="M 4 51 C 4 53.2 5.8 55 8 55 L 56 55 C 58.2 55 60 53.2 60 51 L 60 52 C 60 54.2 58.2 56 56 56 L 8 56 C 5.8 56 4 54.2 4 52 Z" fill="#064E3B" />

  <!-- Top Lip Notch -->
  <rect x="27" y="42" width="10" height="1.5" rx="0.75" fill="#064E3B" />

  <!-- Keyboard Recess -->
  <path d="M 12 44 L 52 44 L 50.5 48.5 L 13.5 48.5 Z" fill="#064E3B" />

  <!-- Key Rows -->
  <path d="M 14 45 L 24 45 L 23.5 47.5 L 14.5 47.5 Z" fill="#10B981" />
  <path d="M 25.5 45 L 38.5 45 L 38 47.5 L 25 47.5 Z" fill="#EF4444" />
  <path d="M 40 45 L 50 45 L 49.5 47.5 L 39.5 47.5 Z" fill="#10B981" />

  <!-- Trackpad -->
  <path d="M 26 50 L 38 50 L 37.5 53.5 L 26.5 53.5 Z" fill="#064E3B" />
</svg>